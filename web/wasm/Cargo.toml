[package]
name = "soup-connectome-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "WASM validation boundary for soup-connectome graph artifacts"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
